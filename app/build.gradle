plugins { id 'com.android.application' }

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Bundle the exact web client used by this build so the Android app never opens a stale or missing Pages route.
tasks.register('copyJarvisWebClient', Copy) {
    from(rootProject.file('index.html'))
    into("$projectDir/src/main/assets")
    rename { 'jarvis.html' }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('copyJarvisWebClient')
}

android {
    namespace 'com.hrishikesh.jarvis'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        // A fresh application ID keeps this build separate from every previous JARVIS package.
        // The Android launcher name remains exactly J.A.R.V.I.S; the version is metadata only.
        applicationId 'com.hrishikesh.jarvis.eight.release'
        minSdk 23
        targetSdk 35
        versionCode 801
        versionName '8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'JARVIS_TV', 'false'
        buildConfigField 'String', 'ASSISTANT_NAME', '\"J.A.R.V.I.S\"'
    }
    flavorDimensions += 'device'
    productFlavors {
        phone { dimension 'device' }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
            buildConfigField 'boolean', 'JARVIS_TV', 'true'
        }
    }
}
