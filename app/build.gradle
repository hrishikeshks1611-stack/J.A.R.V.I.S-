plugins { id 'com.android.application' }

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android {
    namespace 'com.hrishikesh.jarvis'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.hrishikesh.jarvis16'
        minSdk 23
        targetSdk 35
        versionCode 1600
        versionName '16.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'JARVIS_TV', 'false'
        buildConfigField 'String', 'ASSISTANT_NAME', '"J.A.R.V.I.S."'
    }
    flavorDimensions += 'device'
    productFlavors {
        phone {
            dimension 'device'
        }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
            buildConfigField 'boolean', 'JARVIS_TV', 'true'
        }
    }
    buildTypes {
        release {
            // Owner-test build: use the Android Gradle debug certificate so this APK can be installed.
            // This is not a Play Store / production distribution configuration.
            signingConfig signingConfigs.debug
        }
    }
}

// Bundle the exact web interface into the APK. The UI can open without relying on
// GitHub Pages being reachable; authenticated AI services still use the network.
tasks.register('prepareJarvisWebAssets') {
    def sourceHtml = rootProject.file('index.html')
    def targetHtml = file('src/main/assets/index.html')
    inputs.file(sourceHtml)
    outputs.file(targetHtml)
    doLast {
        targetHtml.parentFile.mkdirs()
        def html = sourceHtml.getText('UTF-8')
        html = html.replaceAll(/<link rel="manifest"[^>]*>/, '')
        html = html.replaceAll(/<link rel="icon"[^>]*>/, '')
        html = html.replaceAll(/<link rel="apple-touch-icon"[^>]*>/, '')
        targetHtml.setText(html, 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareJarvisWebAssets') }
