plugins { id 'com.android.application' }

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android {
    // Keep the source namespace stable; the installable app has its own package identity.
    namespace 'com.hrishikesh.jarvis'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // Deliberately different from the legacy 5.0.2 package so both apps can coexist.
        applicationId 'com.hrishikesh.jarvis.next'
        minSdk 23
        targetSdk 35
        versionCode 600
        versionName '6.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'JARVIS_TV', 'false'
        buildConfigField 'String', 'ASSISTANT_NAME', '"J.A.R.V.I.S."'
    }
    flavorDimensions += 'device'
    productFlavors {
        phone {
            dimension 'device'
        }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
            buildConfigField 'boolean', 'JARVIS_TV', 'true'
        }
    }
}
