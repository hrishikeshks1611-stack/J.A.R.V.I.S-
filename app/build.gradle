plugins { id 'com.android.application' }

android {
    namespace 'com.hrishikesh.jarvis'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.hrishikesh.jarvis.rebirth'
        minSdk 23
        targetSdk 35
        versionCode 600
        versionName '6.0.0'
        buildConfigField 'boolean', 'JARVIS_TV', 'false'
        buildConfigField 'String', 'ASSISTANT_NAME', '"J.A.R.V.I.S."'
    }
    flavorDimensions += 'device'
    productFlavors {
        phone {
            dimension 'device'
        }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
            buildConfigField 'boolean', 'JARVIS_TV', 'true'
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.activity:activity:1.9.3'
}
