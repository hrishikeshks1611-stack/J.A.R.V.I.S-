name: JARVIS Google Firebase Test Lab physical-device checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: \${{ secrets.FIREBASE_PROJECT_ID }}
      GCP_SA_KEY: \${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Require Google Cloud test credentials
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID repository secret"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "Missing GCP_SA_KEY repository secret"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone app and instrumentation tests
        run: gradle --no-daemon assemblePhoneDebug assemblePhoneDebugAndroidTest
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.GCP_SA_KEY }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: \${{ secrets.FIREBASE_PROJECT_ID }}
      - name: Select an available physical Android device
        id: device
        run: |
          set -euo pipefail
          gcloud firebase test android models list --format=json > models.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          models=json.load(open("models.json"))
          candidates=[]
          for model in models:
              versions=model.get("supportedVersionIds", [])
              if model.get("form") == "PHYSICAL" and "35" in [str(v) for v in versions]:
                  candidates.append(model.get("id"))
          if not candidates:
              raise SystemExit("Firebase Test Lab has no listed physical device supporting Android 15 (API 35).")
          print("model="+candidates[0])
          PY
      - name: Run JARVIS camera and microphone checks on Google physical Android hardware
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/phone/debug/app-phone-debug.apk \
            --test app/build/outputs/apk/androidTest/phone/debug/app-phone-debug-androidTest.apk \
            --device model="\${{ steps.device.outputs.model }}",version=35,locale=en,orientation=portrait \
            --timeout 8m \
            --results-dir="jarvis/\${GITHUB_RUN_ID}-\${GITHUB_RUN_ATTEMPT}"

