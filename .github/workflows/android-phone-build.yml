name: Android phone build verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-phone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@ddc5b4b7f2f3c3c9d4c2c7f4c3f3d2a6b9c8e1f0 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build existing phone app variant
        run: ./gradlew --no-daemon assemblePhoneDebug
