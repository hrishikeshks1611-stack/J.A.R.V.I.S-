name: Fresh Android Build
on:
  push:
    branches: [jarvis-fresh-1.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Run command parser tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble fresh phone APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package, icon resources and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          aapt dump badging "$APK" | tee /tmp/jarvis-badging.txt
          grep -F "package: name='com.hrishikesh.jarvis.fresh' versionCode='111' versionName='1.0.11'" /tmp/jarvis-badging.txt
          aapt dump xmltree "$APK" AndroidManifest.xml | grep -E 'ic_launcher|jarvis_splash|SplashTheme'
          unzip -l "$APK" | grep -F 'res/drawable/jarvis_reactor.xml'
          unzip -l "$APK" | grep -F 'res/drawable/jarvis_splash.xml'
          unzip -l "$APK" | grep -F 'res/mipmap-anydpi-v26/ic_launcher.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Fresh-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
