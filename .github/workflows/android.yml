name: Fresh Android Build
on:
  push:
    branches: [jarvis-fresh-1.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble fresh phone APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify package, version, icon and splash resources
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/jarvis-badging.txt
          grep -q "package: name='com.hrishikesh.jarvis.fresh' versionCode='114' versionName='1.0.14'" /tmp/jarvis-badging.txt
          grep -q "application-icon-.*:.*res/" /tmp/jarvis-badging.txt
          "$AAPT" dump resources "$APK" > /tmp/jarvis-resources.txt
          grep -q 'jarvis_reactor' /tmp/jarvis-resources.txt
          grep -q 'jarvis_splash' /tmp/jarvis-resources.txt
          grep -q 'android:drawable="@drawable/jarvis_reactor"' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'android:drawable="@drawable/jarvis_reactor"' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:drawable="@drawable/jarvis_reactor"' app/src/main/res/drawable/jarvis_splash.xml
          grep -q 'A49,49' app/src/main/res/drawable/jarvis_reactor.xml
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml'
          unzip -l "$APK" | grep -q 'res/drawable/jarvis_splash.xml'
          unzip -l "$APK" | grep -q 'res/drawable/jarvis_reactor.xml'
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes([0-9]+)?[.]dex'
          mkdir -p release
          cp "$APK" release/JARVIS-1.0.14-ALFRED-ARC.apk
          sha256sum release/JARVIS-1.0.14-ALFRED-ARC.apk | tee release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-1.0.14-ALFRED-ARC-APK
          path: |
            release/JARVIS-1.0.14-ALFRED-ARC.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
