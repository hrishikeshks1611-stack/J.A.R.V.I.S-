name: Deploy JARVIS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared root site
        uses: actions/checkout@v4

      - name: Checkout isolated JARVIS 7.0 frontend
        uses: actions/checkout@v4
        with:
          ref: jarvis-7.0-new-app
          path: jarvis-7.0-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble and validate both sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/7.0
          rsync -a --exclude='.git' --exclude='site' --exclude='jarvis-7.0-source' ./ site/
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='app' \
            --exclude='node_modules' \
            jarvis-7.0-source/ site/7.0/
          touch site/.nojekyll
          touch site/7.0/.nojekyll
          test -s site/index.html
          test -s site/7.0/index.html
          test -s site/7.0/manifest.webmanifest
          test -s site/7.0/sw.js
          grep -q 'id="wakeWordButton"' site/7.0/index.html
          grep -q 'JARVIS' site/7.0/index.html
          echo "Validated shared root and isolated JARVIS 7.0 frontend."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
