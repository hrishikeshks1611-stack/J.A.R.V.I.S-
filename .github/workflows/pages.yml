name: Deploy JARVIS to GitHub Pages

# JARVIS 7.0 is published as /7.0/ by the main-branch Pages workflow.
# Do not deploy directly from this feature branch: the Pages environment is
# restricted to the repository's main publishing branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deployment is handled by the main publishing workflow
        run: echo "Use the main branch Pages workflow to publish both the shared root and JARVIS 7.0."
