name: Build complete JARVIS Android and TV APKs
# CI artifacts are build outputs; installation and on-device behaviour require separate validation.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run phone and Android TV unit tests
        run: gradle --no-daemon testPhoneDebugUnitTest testTvDebugUnitTest
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify phone APK package and version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis' versionCode='1600' versionName='16.0.0'"
          sha256sum "$APK"
          echo "Verified package: com.hrishikesh.jarvis"
          echo "Verified version: 16.0.0 (1600)"
          echo "Note: this does not verify compatibility with the copy installed on a user's phone."
      - name: Upload phone verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-phone-debug-verification-complete
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-TV-debug-verification-complete
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30
