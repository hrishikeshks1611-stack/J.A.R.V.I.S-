  "output": "name: Build JARVIS Android and TV APK verification artifacts\n# Debug APKs are for CI verification only. Do not publish installable releases\n# until the original Build 39 signing key is recovered and verified.\non:\n  workflow_dispatch:\n  push:\n    branches: [ main, jarvis-intelligence-tools ]\n    paths:\n      - 'app/**'\n      - '*.gradle'\n      - 'settings.gradle'\n      - '.github/workflows/android-apk.yml'\npermissions:\n  contents: read\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Set up Java\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n        with:\n          accept-android-sdk-licenses: true\n          packages: platform-tools\n      - name: Install Android platform\n        run: sdkmanager \"platforms;android-35\" \"build-tools;35.0.0\"\n      - name: Set up Gradle\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.9'\n      - name: Build phone and Android TV APKs\n        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug\n      - name: Upload phone verification artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: JARVIS-Android-phone-debug-verification\n          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk\n          if-no-files-found: error\n          retention-days: 30\n      - name: Upload Android TV verification artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: JARVIS-Android-TV-debug-verification\n          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk\n          if-no-files-found: error\n          retention-days: 30\n\n  android-10-emulator-smoke:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Set up Java\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n        with:\n          accept-android-sdk-licenses: true\n          packages: platform-tools\n      - name: Install Android platform\n        run: sdkmanager \"platforms;android-35\" \"build-tools;35.0.0\"\n      - name: Set up Gradle\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.9'\n      - name: Build phone APK\n        run: gradle --no-daemon assemblePhoneDebug\n      - name: Smoke-test foreground microphone service on Android 10\n        uses: reactivecircus/android-emulator-runner@v2\n        with:\n          api-level: 29\n          arch: x86_64\n          profile: pixel_2\n          disable-animations: true\n          script: |\n            set -euo pipefail\n            adb install app/build/outputs/apk/phone/debug/app-phone-debug.apk\n            adb shell pm grant com.hrishikesh.jarvis android.permission.RECORD_AUDIO\n            adb shell am start -n com.hrishikesh.jarvis/.MainActivity\n            sleep 5\n            # Use the debug-only launcher; the production service stays private.\n            adb shell am start -n com.hrishikesh.jarvis/.WakeWordTestActivity\n            ready=0\n            for attempt in $(seq 1 180); do\n              if adb shell dumpsys notification --noredact | grep -q \"offline wake-word detection active\"; then\n                ready=1\n                break\n              fi\n              if ! adb shell dumpsys activity services com.hrishikesh.jarvis | grep -q WakeWordService; then\n                echo \"Wake-word service exited before the offline model became ready.\"\n                adb logcat -d -s AndroidRuntime:E WakeWordService:E\n                exit 1\n              fi\n              sleep 2\n            done\n            if [ \"$ready\" -ne 1 ]; then\n              echo \"Wake-word model did not become ready within six minutes.\"\n              adb logcat -d -s AndroidRuntime:E WakeWordService:E\n              adb shell dumpsys notification --noredact | grep -i -A 5 -B 5 JARVIS || true\n              exit 1\n            fi\n            adb shell am start -n com.hrishikesh.jarvis/.WakeWordTestActivity -a com.hrishikesh.jarvis.TEST_STOP_WAKE\n            sleep 3\n            if adb shell dumpsys activity services com.hrishikesh.jarvis | grep -q WakeWordService; then\n              echo \"Wake-word service did not stop cleanly.\"\n              adb logcat -d -s AndroidRuntime:E WakeWordService:E\n              exit 1\n            fi\n            echo \"Android 10 foreground-service start, offline model load, and stop checks passed.\"\n",
  "cpu_ns": 11286000
}