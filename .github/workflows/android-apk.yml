name: Build JARVIS Android and TV APK verification artifacts
# Debug APKs are for CI verification only. Do not publish installable releases
# until the original Build 39 signing key is recovered and verified.
on:
  workflow_dispatch:
  push:
    branches: [ main, jarvis-intelligence-tools ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Upload phone verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-phone-debug-verification
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-TV-debug-verification
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-10-emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone APK
        run: gradle --no-daemon assemblePhoneDebug
      - name: Smoke-test foreground microphone service on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
            adb wait-for-device
            adb install "$APK"
            adb shell pm grant com.hrishikesh.jarvis android.permission.RECORD_AUDIO
            adb logcat -c
            adb shell am start -W -n com.hrishikesh.jarvis/.MainActivity
            sleep 3
            adb shell am start -W -n com.hrishikesh.jarvis/.WakeWordTestActivity
            ready=0
            for attempt in $(seq 1 180); do
              if adb shell dumpsys notification --noredact | grep -q "offline wake-word detection active"; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Wake-word service did not reach READY within six minutes. Capturing diagnostics:"
              echo "----- Wake-word and Android runtime logs -----"
              adb logcat -d -v threadtime | grep -E "WakeWordTest|WakeWordService|AndroidRuntime|ActivityManager|ForegroundService|Permission" || true
              echo "----- Activity services -----"
              adb shell dumpsys activity services com.hrishikesh.jarvis || true
              echo "----- Process state -----"
              adb shell pidof com.hrishikesh.jarvis || true
              echo "----- Microphone permission -----"
              adb shell dumpsys package com.hrishikesh.jarvis | grep -A 10 RECORD_AUDIO || true
              echo "----- JARVIS notifications -----"
              adb shell dumpsys notification --noredact | grep -i -A 8 -B 5 JARVIS || true
              exit 1
            fi
            echo "Wake-word service reached READY on Android 10."
            adb shell am start -W -n com.hrishikesh.jarvis/.WakeWordTestActivity -a com.hrishikesh.jarvis.TEST_STOP_WAKE
            sleep 3
            if adb shell dumpsys activity services com.hrishikesh.jarvis | grep -q WakeWordService; then
              echo "Wake-word service did not stop cleanly."
              adb logcat -d -v threadtime | grep -E "WakeWordTest|WakeWordService|AndroidRuntime|ActivityManager" || true
              exit 1
            fi
            echo "Android 10 foreground-service start, offline model load, and stop checks passed."
