name: Build J.A.R.V.I.S Android phone and TV packages
on:
  workflow_dispatch:
  push:
    branches: [ jarvis-clean-brand-build ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run phone and Android TV unit tests
        run: gradle --no-daemon testPhoneDebugUnitTest testTvDebugUnitTest
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify new independent app identities
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          PHONE_APK="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          TV_APK="app/build/outputs/apk/tv/debug/app-tv-debug.apk"
          test -s "$PHONE_APK"
          test -s "$TV_APK"
          PHONE_BADGING="$("$AAPT" dump badging "$PHONE_APK")"
          TV_BADGING="$("$AAPT" dump badging "$TV_APK")"
          echo "$PHONE_BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis.eight.release' versionCode='801' versionName='8.0'"
          echo "$TV_BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis.eight.release.tv' versionCode='801' versionName='8.0-tv'"
          if echo "$PHONE_BADGING" | grep -Eq "package: name='com.hrishikesh.jarvis(\.next)?'"; then
            echo "ERROR: J.A.R.V.I.S package collides with an earlier JARVIS app"
            exit 1
          fi
          sha256sum "$PHONE_APK" "$TV_APK"
          echo "$PHONE_BADGING" | grep -Fq "application-label:'J.A.R.V.I.S'"
          echo "$TV_BADGING" | grep -Fq "application-label:'J.A.R.V.I.S'"
          unzip -l "$PHONE_APK" | grep -Fq "res/drawable/ic_jarvis_launcher.xml"
          unzip -l "$PHONE_APK" | grep -Fq "assets/jarvis.html"
          echo "Verified exact J.A.R.V.I.S launcher label and packaged ARC reactor icon."
          echo "Verified independent phone package: com.hrishikesh.jarvis.eight.release"
          echo "Verified independent TV package: com.hrishikesh.jarvis.eight.release.tv"
      - name: Upload phone build artifact for QA
        uses: actions/upload-artifact@v4
        with:
          name: J.A.R.V.I.S-Android-phone-QA
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV build artifact for QA
        uses: actions/upload-artifact@v4
        with:
          name: J.A.R.V.I.S-Android-TV-QA
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM is unavailable on this runner; the emulator will use software rendering."
          fi
      - name: Install and launch on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio
          emulator-boot-timeout: 900
          disable-animations: true
          script: gradle --no-daemon connectedPhoneDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hrishikesh.jarvis.MainActivityLaunchTest
