name: Build JARVIS Android and TV APKs
# Rebuild both APKs after the local Algieba speech-cache update.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-phone
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jarvis-tv-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/tv/debug/app-tv-debug.apk app/build/outputs/apk/phone/debug/app-phone-debug.apk --title "JARVIS Android and TV build ${GITHUB_RUN_NUMBER}" --notes "Includes the Android phone edition and Android TV edition. Debug-signed APKs for sideload installation."
