name: Build separate-install JARVIS Android and TV APKs
# These artifacts use a new package identity and coexist with legacy JARVIS 5.0.2.
# CI verification does not replace physical-device installation and migration tests.
on:
  workflow_dispatch:
  push:
    branches: [ main, jarvis-master-brain ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run phone and Android TV unit tests
        run: gradle --no-daemon testPhoneDebugUnitTest testTvDebugUnitTest
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify separate package identities and versions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          PHONE_APK="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          TV_APK="app/build/outputs/apk/tv/debug/app-tv-debug.apk"
          test -s "$PHONE_APK"
          test -s "$TV_APK"
          PHONE_BADGING="$("$AAPT" dump badging "$PHONE_APK")"
          TV_BADGING="$("$AAPT" dump badging "$TV_APK")"
          echo "$PHONE_BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis.next' versionCode='600' versionName='6.0.0'"
          echo "$TV_BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis.next.tv' versionCode='600' versionName='6.0.0-tv'"
          if echo "$PHONE_BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis'"; then
            echo "ERROR: phone APK would overwrite legacy JARVIS"
            exit 1
          fi
          sha256sum "$PHONE_APK" "$TV_APK"
          echo "Verified phone package: com.hrishikesh.jarvis.next"
          echo "Verified TV package: com.hrishikesh.jarvis.next.tv"
          echo "Both package IDs are distinct from legacy com.hrishikesh.jarvis."
      - name: Upload separate-install phone APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-6.0.0-Android-phone-separate-install
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload separate-install Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-6.0.0-Android-TV-separate-install
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30
