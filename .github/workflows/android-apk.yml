name: Build J.A.R.V.I.S. 16.0 Android phone release candidate
# Build artifacts are not equivalent to a release installed and tested on a physical device.
on:
  workflow_dispatch:
  push:
    branches: [ jarvis-16.0-foundation, jarvis-17.0-foundation ]
    paths:
      - 'app/**'
      - 'index.html'
      - 'tests/**'
      - 'lib/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'api/live-token.js'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and run repository tests
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android phone unit tests
        run: gradle --no-daemon testPhoneDebugUnitTest
      - name: Build Android phone release APK
        run: gradle --no-daemon assemblePhoneRelease
      - name: Verify phone release APK package and version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/phone/release/app-phone-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.hrishikesh.jarvis16' versionCode='1700' versionName='17.0.0'"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          echo "Verified package: com.hrishikesh.jarvis16"
          echo "Verified version: 17.0.0 (1700)"
          echo "Verified APK signature for owner testing"
      - name: Upload phone release candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-17.0-phone-release-candidate
          path: app/build/outputs/apk/phone/release/app-phone-release.apk
          if-no-files-found: error
          retention-days: 30
