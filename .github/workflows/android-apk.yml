name: Build JARVIS Android and TV APK verification artifacts
# Debug APKs are for CI verification only. Do not publish installable releases
# until the original Build 39 signing key is recovered and verified.
on:
  workflow_dispatch:
  push:
    branches: [ main, jarvis-intelligence-tools ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and Android TV APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify phone APK exists
        run: test -s "$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
      - name: Upload phone verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-phone-debug-verification
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-TV-debug-verification
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-10-emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone APK
        run: gradle --no-daemon assemblePhoneDebug
      - name: Verify APK path before emulator launch
        run: |
          APK_FILE_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          echo "Checking APK: $APK_FILE_PATH"
          test -s "$APK_FILE_PATH"
          ls -lh "$APK_FILE_PATH"
      - name: Install Android 10 emulator image (retry transient SDK download failures)
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="system-images;android-29;google_apis;x86_64"
          for attempt in 1 2 3; do
            echo "Installing emulator and Android 10 image (attempt $attempt/3)"
            if yes | sdkmanager --install "emulator" "$PACKAGE"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android emulator SDK installation failed after three attempts."
              exit 1
            fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            sleep 10
          done
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/system-images/android-29/google_apis/x86_64"
      - name: Smoke-test foreground microphone service on Android 10
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          test -s "$APK_FILE_PATH"
          echo "Creating Android 10 API 29 emulator."
          echo "no" | avdmanager create avd --force --name jarvis-api29 --package "system-images;android-29;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd jarvis-api29 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          adb wait-for-device
          booted=0
          for attempt in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited during boot."
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android 10 emulator did not finish booting."
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install "$APK_FILE_PATH"
          adb shell pm grant com.hrishikesh.jarvis android.permission.RECORD_AUDIO
          adb logcat -c
          adb shell am start -W -n com.hrishikesh.jarvis/.MainActivity
          sleep 3
          adb shell am start -W -n com.hrishikesh.jarvis/.WakeWordTestActivity
          ready=0
          for attempt in $(seq 1 180); do
            if adb logcat -d -s WakeWordService:I | grep -q "offline wake-word service ready"; then
              ready=1
              break
            fi
            if adb logcat -d -s WakeWordService:E | grep -q "Failed to prepare offline wake-word service"; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Wake-word service did not report READY within six minutes. Diagnostics:"
            adb logcat -d -v threadtime | grep -E "WakeWordTest|WakeWordService|AndroidRuntime|ActivityManager|ForegroundService|Permission" || true
            adb shell dumpsys activity services com.hrishikesh.jarvis || true
            adb shell pidof com.hrishikesh.jarvis || true
            adb shell dumpsys package com.hrishikesh.jarvis | grep -A 10 RECORD_AUDIO || true
            exit 1
          fi
          echo "Wake-word service reached READY on Android 10."
          adb shell am start -W -n com.hrishikesh.jarvis/.WakeWordTestActivity -a com.hrishikesh.jarvis.TEST_STOP_WAKE
          sleep 3
          if adb shell dumpsys activity services com.hrishikesh.jarvis | grep -q WakeWordService; then
            echo "Wake-word service did not stop cleanly."
            adb logcat -d -v threadtime | grep -E "WakeWordTest|WakeWordService|AndroidRuntime|ActivityManager" || true
            exit 1
          fi
          echo "Android 10 foreground-service start, offline model load, and stop checks passed."
