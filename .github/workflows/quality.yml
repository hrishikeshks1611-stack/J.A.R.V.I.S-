name: JARVIS quality checks

on:
  push:
    branches: [ main, jarvis-5.0-development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shared-memory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install JARVIS runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test shared-memory and office-file helpers
        run: node --test tests/*.test.mjs
