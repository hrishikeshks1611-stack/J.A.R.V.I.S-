name: JARVIS quality checks

on:
  push:
    branches: [ main, jarvis-5.0-development, jarvis-5-to-10-continuation, fix/parallel-install-preview ]
  pull_request:
    branches: [ main, jarvis-5-to-10-continuation, jarvis-five-pillars-upgrade, feature/youtube-music-direct-playback ]

permissions:
  contents: read

jobs:
  shared-memory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install JARVIS runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check server and API JavaScript syntax
        run: |
          for file in server.js api/*.js lib/*.js; do node --check "$file"; done
      - name: Test shared-memory, agent, and office-file helpers
        run: node --test tests/*.test.mjs
      - name: Read-only production API smoke
        run: node scripts/smoke-production-api.mjs
