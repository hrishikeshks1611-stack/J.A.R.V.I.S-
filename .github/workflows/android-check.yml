name: JARVIS Android microphone and wake-word checks

on:
  push:
    branches: [ jarvis-mic-wakeword-clean, jarvis-5.0-development, jarvis-5-to-10-continuation ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Publish phone and TV APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apks
          path: |
            app/build/outputs/apk/phone/debug/app-phone-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run deterministic offline wake-phrase unit tests
        run: gradle --no-daemon testPhoneDebugUnitTest
      - name: Install APK and exercise rear/front CameraX capture on Android 15 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install app/build/outputs/apk/phone/debug/app-phone-debug.apk
            adb shell pm grant com.hrishikesh.jarvis android.permission.CAMERA
            adb shell pm path com.hrishikesh.jarvis
            adb shell am start -n com.hrishikesh.jarvis/.CameraCaptureActivity --ez camera_selfie false
            for i in $(seq 1 25); do
              count=$(adb shell ls /sdcard/Pictures/JARVIS 2>/dev/null | grep -c '^JARVIS_' || true)
              if [ "$count" -ge 1 ]; then break; fi
              sleep 1
            done
            test "$count" -ge 1
            adb shell am start -n com.hrishikesh.jarvis/.CameraCaptureActivity --ez camera_selfie true
            for i in $(seq 1 25); do
              count=$(adb shell ls /sdcard/Pictures/JARVIS 2>/dev/null | grep -c '^JARVIS_' || true)
              if [ "$count" -ge 2 ]; then break; fi
              sleep 1
            done
            test "$count" -ge 2
            echo "PASS: APK installed; rear photo and front selfie were saved."
