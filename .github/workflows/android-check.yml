name: JARVIS Android update compatibility checks

on:
  push:
    branches: [ jarvis-5.0-development, jarvis-5-to-10-continuation ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android-update-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed update
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download the exact Build 39 phone APK
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/hrishikeshks1611-stack/J.A.R.V.I.S-/releases/download/jarvis-tv-39/app-phone-debug.apk" \
            --output build39-phone.apk
          test -s build39-phone.apk

      - name: Build proposed phone update APK
        run: gradle --no-daemon assemblePhoneDebug

      - name: Install Build 39, preserve app data, then apply proposed update
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            echo "DIAG 1: verify APK files"
            test -s "$GITHUB_WORKSPACE/build39-phone.apk"
            test -s "$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
            echo "DIAG 2: confirm emulator is ready"
            timeout 60s adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo "DIAG 3: install Build 39 baseline"
            timeout 120s adb install "$GITHUB_WORKSPACE/build39-phone.apk"
            echo "DIAG 4: create app-data preservation marker"
            timeout 30s adb shell run-as com.hrishikesh.jarvis mkdir -p files
            timeout 30s adb shell run-as com.hrishikesh.jarvis touch files/jarvis-update-preservation-check
            echo "DIAG 5: verify marker before update"
            timeout 30s adb shell run-as com.hrishikesh.jarvis ls files | grep -Fxq jarvis-update-preservation-check
            echo "DIAG 6: install candidate over existing app"
            timeout 120s adb install -r "$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
            echo "DIAG 7: verify package version"
            timeout 30s adb shell pm path com.hrishikesh.jarvis
            timeout 30s adb shell dumpsys package com.hrishikesh.jarvis | grep -q versionCode=501
            echo "DIAG 8: verify app data survived update"
            timeout 30s adb shell run-as com.hrishikesh.jarvis ls files | grep -Fxq jarvis-update-preservation-check
            echo "PASS: Build 39 updated in place; versionCode 501 installed; app-private sentinel survived."


      - name: Compile phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
