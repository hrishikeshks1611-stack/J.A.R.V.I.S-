name: JARVIS Android update compatibility checks

on:
  push:
    branches: [ jarvis-5.0-development, jarvis-5-to-10-continuation ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android-update-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed update
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download the exact Build 39 phone APK
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/hrishikeshks1611-stack/J.A.R.V.I.S-/releases/download/jarvis-tv-39/app-phone-debug.apk" \
            --output build39-phone.apk
          test -s build39-phone.apk
      - name: Build proposed phone update APK
        run: gradle --no-daemon assemblePhoneDebug
      - name: Confirm package identity and prepare clean-install test
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BASELINE_PACKAGE="$("$AAPT" dump badging build39-phone.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          CANDIDATE_PACKAGE="$("$AAPT" dump badging app/build/outputs/apk/phone/debug/app-phone-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$BASELINE_PACKAGE" = "com.hrishikesh.jarvis"
          test "$CANDIDATE_PACKAGE" = "$BASELINE_PACKAGE"
          echo "PASS: candidate keeps the existing JARVIS package. This test will replace only the emulator copy; no real phone is touched."
      - name: Test clean JARVIS replacement on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            test -s "$GITHUB_WORKSPACE/build39-phone.apk"
            test -s "$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
            timeout 60s adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            timeout 120s adb install "$GITHUB_WORKSPACE/build39-phone.apk"
            echo "Build 39 installed successfully; skipping its remote-web launch because it can wait indefinitely for network content in the emulator."
            timeout 15s adb uninstall com.hrishikesh.jarvis
            timeout 120s adb install "$GITHUB_WORKSPACE/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
            timeout 30s adb shell dumpsys package com.hrishikesh.jarvis | grep -q versionCode=501
            echo "PASS: clean JARVIS 5.0.1 install completed on the disposable emulator."
            adb logcat -c
            gradle --no-daemon connectedPhoneDebugAndroidTest
            echo "Waiting for offline model and microphone recognizer readiness"
            timeout 240s bash -c 'until adb logcat -d -s WakeWordService:I | grep -q "offline speech service ready"; do sleep 2; done'
            adb logcat -d -s WakeWordService:I | grep -F "offline speech service ready"
            echo "PASS: offline dictation service became ready after the in-place update."

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed update
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify native offline dictation starts on Android 10
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb logcat -c
            gradle --no-daemon connectedPhoneDebugAndroidTest
            echo "Waiting for offline model and microphone recognizer readiness"
            timeout 240s bash -c 'until adb logcat -d -s WakeWordService:I | grep -q "offline speech service ready"; do sleep 2; done'
            adb logcat -d -s WakeWordService:I | grep -F "offline speech service ready"
            echo "PASS: native offline dictation service started on Android 10."
