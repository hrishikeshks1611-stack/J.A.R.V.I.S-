name: JARVIS Android update compatibility checks

on:
  push:
    branches: [ jarvis-5.0-development, jarvis-5-to-10-continuation, jarvis-wakeword-reliability-fix, jarvis-crystal-clear-mic ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed update
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify native offline dictation starts on Android 10
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb logcat -c
            timeout 180s gradle --no-daemon connectedPhoneDebugAndroidTest
            echo "Waiting for the real Android AudioRecord capture loop to start"
            if ! timeout 300s bash -c 'until adb logcat -d -s WakeWordService | grep -q "Audio capture active:"; do sleep 2; done'; then
              echo "Wake-word service did not become ready. Full service log follows:"
              adb logcat -d -s WakeWordService:V
              exit 1
            fi
            adb logcat -d -s WakeWordService:V
            echo "PASS: Android 10 initialized and started the JARVIS microphone capture loop."
