<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18"><meta name="description" content="J.A.R.V.I.S. — Personal voice-first AI assistant">
<link rel="manifest" href="/manifest.webmanifest">
<title>J.A.R.V.I.S.</title>
<style>
:root{color-scheme:dark;--bg:#050b18;--panel:#0a1426;--line:#183b59;--cyan:#62d9ff;--blue:#218bff;--muted:#8ba6bd;--white:#eaf7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 24%,#0c2944 0,#071426 38%,#030711 78%);color:var(--white);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.shell{max-width:900px;margin:auto;min-height:100vh;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17334b;padding:8px 2px 16px}.brand{letter-spacing:.28em;font-size:13px;color:#bdeeff}.brand small{display:block;letter-spacing:.18em;color:#6e9bb9;font-size:9px;margin-top:3px}.status{font-size:11px;color:#8acfe9;letter-spacing:.12em}
main{flex:1;display:flex;flex-direction:column;align-items:center}
.core-wrap{height:320px;width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.core{width:190px;height:190px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 24px #168bff66)}
.core:before,.core:after{content:"";position:absolute;border:1px solid #49caff88;border-radius:50%;inset:0;box-shadow:0 0 24px #168bff33,inset 0 0 22px #168bff22}
.core:before{transform:scaleX(.48) rotate(35deg);animation:spin 9s linear infinite}.core:after{transform:scaleX(.72) rotate(-35deg);animation:spin 12s linear infinite reverse}
.ring{position:absolute;inset:15px;border:2px solid transparent;border-top-color:#72e4ff;border-bottom-color:#238fff;border-radius:50%;animation:spin 5s linear infinite}
.ring.two{inset:29px;border-width:1px;border-left-color:#51bfff;border-right-color:#51bfff;animation-duration:3.5s;animation-direction:reverse}
.orb{width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#e6fbff 0,#6ce3ff 8%,#168fff 35%,#071d4c 72%,#020713 100%);box-shadow:0 0 20px #50d9ff,0 0 55px #087bff99,inset -10px -12px 22px #020817;animation:pulse 3s ease-in-out infinite}
.core.listening .orb{box-shadow:0 0 28px #7affdc,0 0 75px #16dba988}.core.thinking .ring{animation-duration:1s}.core.speaking .orb{animation-duration:.55s}
@keyframes spin{to{rotate:360deg}}@keyframes pulse{50%{transform:scale(1.09);filter:brightness(1.25)}}
.greeting{text-align:center;margin-top:-7px}.greeting h1{font-size:clamp(22px,5vw,32px);font-weight:400;letter-spacing:.14em;margin:0}.greeting p{color:var(--muted);font-size:13px;margin:7px 0}
.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0}.control,select{background:#0b1a2d;color:#c8eaff;border:1px solid #24506e;border-radius:20px;padding:9px 14px;font:inherit;font-size:12px}.control:active,.control.active{border-color:var(--cyan);background:#102c45}
.chat{width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px;margin:8px 0 14px}.messages{display:flex;flex-direction:column;gap:10px;max-height:32vh;overflow:auto;padding:2px}.msg{max-width:88%;padding:11px 14px;border:1px solid #1c3b56;border-radius:14px;background:#091629;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#102b45;border-color:#23628a}.msg.jarvis{align-self:flex-start}.composer{display:flex;gap:8px;background:#081426;border:1px solid #1b4564;border-radius:17px;padding:7px}.composer input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;padding:8px;font:inherit}.send{border:0;border-radius:12px;background:linear-gradient(135deg,#087dcb,#1c55aa);color:white;padding:0 17px;font-weight:600}.mic{width:46px;border-radius:12px;border:1px solid #286083;background:#102c45;color:#a8e9ff;font-size:18px}
footer{text-align:center;color:#577c99;font-size:10px;letter-spacing:.12em;padding-top:10px}
@media(max-width:520px){.core-wrap{height:275px}.core{width:166px;height:166px}.orb{width:72px;height:72px}.messages{max-height:28vh}}
</style></head>
<body><div class="shell">
<header><div class="brand">J.A.R.V.I.S.<small>PERSONAL INTELLIGENCE SYSTEM</small></div><div class="status" id="status">● SYSTEM READY</div></header>
<main><div class="core-wrap"><div class="core" id="core"><div class="ring"></div><div class="ring two"></div><div class="orb"></div></div></div>
<div class="greeting"><h1>AT YOUR SERVICE, SIR.</h1><p id="hint">Your personal assistant is standing by.</p></div>
<div class="controls"><select id="mode" aria-label="Personality mode"><option value="professional">Professional</option><option value="witty" selected>Witty</option><option value="philosophical">Philosophical</option></select><select id="voiceChoice" aria-label="Speech voice"><option value="">Auto voice (British preferred)</option></select><button class="control" id="voiceToggle">Voice: On</button><button class="control" id="clear">Clear conversation</button></div>
<section class="chat"><div class="messages" id="messages" aria-live="polite"><div class="msg jarvis">Good evening, Sir. J.A.R.V.I.S. is online. How may I assist?</div></div><form class="composer" id="form"><button class="mic" type="button" id="mic" aria-label="Speak">🎙</button><input id="prompt" autocomplete="off" placeholder="Ask me anything, Sir…" maxlength="12000"><button class="send" type="submit">SEND</button></form></section>
</main><footer>J.A.R.V.I.S. · PERSONAL AI · VOICE-FIRST INTERFACE</footer></div>
<script>
const $=id=>document.getElementById(id), core=$('core'), messages=$('messages');let history=[],voiceOn=true,voices=[],selectedVoiceURI='';
function status(s,cls=''){ $('status').textContent='● '+s.toUpperCase();core.className='core '+cls}
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
function offlineReply(message,mode){const q=message.toLowerCase(),p=mode==='philosophical'?'A thought, Sir: ':mode==='witty'?'Certainly, Sir. ':'';if(/\\b(hello|hi|hey|good morning|good afternoon|good evening)\\b/.test(q))return 'Good day, Sir. All systems are standing by. What can I do for you?';if(/\\b(time|what time)\\b/.test(q))return 'The time on this device is '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+', Sir.';if(/\\b(date|today'?s date|what day)\\b/.test(q))return 'Today is '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+', Sir.';if(/\\b(who are you|your name|introduce yourself)\\b/.test(q))return 'I am J.A.R.V.I.S., your personal assistant interface, Sir.';if(/\\b(search|google|look up)\\b/.test(q)){const t=message.replace(/^(please\\s+)?(search( for)?|google|look up)\\s*/i,'').trim();return t?'Here is your search: https://www.google.com/search?q='+encodeURIComponent(t):'What shall I search for, Sir?'}if(/\\b(open|visit|go to)\\b/.test(q)){const sites=[['youtube','https://youtube.com'],['google','https://google.com'],['gmail','https://mail.google.com'],['wikipedia','https://wikipedia.org'],['github','https://github.com']];const h=sites.find(([n])=>q.includes(n));return h?'Opening '+h[0]+': '+h[1]:'Name a site such as Google, YouTube, Gmail, Wikipedia, or GitHub, Sir.'}if(/\\b(thanks|thank you)\\b/.test(q))return 'Always a pleasure, Sir.';return p+'the no-key mode can handle greetings, time, date, basic identity, common websites, and web searches. Open-ended questions need an AI model, Sir.'}
function loadVoices(){voices=speechSynthesis.getVoices();const picker=$('voiceChoice'),old=picker.value;picker.innerHTML='<option value="">Auto voice (British preferred)</option>';voices.filter(v=>/^en/i.test(v.lang)).forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';picker.appendChild(o)});picker.value=old||selectedVoiceURI||'';}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}$('voiceChoice').onchange=e=>{selectedVoiceURI=e.target.value;}
function speak(text){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const chosen=voices.find(v=>v.voiceURI===selectedVoiceURI);const britishMale=voices.find(v=>/^en-GB/i.test(v.lang)&&/daniel|george|arthur|oliver|male|ryan|james|thomas/i.test(v.name));const british=britishMale||voices.find(v=>/^en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));const voice=chosen||british;if(voice){u.voice=voice;u.lang=voice.lang}u.rate=.94;u.pitch=.82;u.onstart=()=>status('Speaking','speaking');u.onend=()=>status('System ready');speechSynthesis.speak(u)}
$('voiceToggle').onclick=()=>{voiceOn=!voiceOn;$('voiceToggle').textContent='Voice: '+(voiceOn?'On':'Off');if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('clear').onclick=()=>{history=[];messages.innerHTML='';add('Conversation cleared, Sir. What shall we discuss?','jarvis')};
$('form').onsubmit=async e=>{e.preventDefault();const message=$('prompt').value.trim();if(!message)return;$('prompt').value='';add(message,'user');history.push({role:'user',text:message});status('Thinking','thinking');$('hint').textContent='Processing your request…';try{let reply;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history,mode:$('mode').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Service error');reply=data.reply||'I have no response, Sir.';}catch(_){reply=offlineReply(message,$('mode').value)}add(reply,'jarvis');history.push({role:'model',text:reply});history=history.slice(-20);$('hint').textContent='Ready when you are.';speak(reply);if(!voiceOn)status('System ready');}catch(err){const msg='I could not reach my intelligence service, Sir. '+err.message;add(msg,'jarvis');$('hint').textContent='The AI service needs to be configured.';status('Service unavailable');speak(msg)}};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('Voice recognition is not supported by this browser, Sir.','jarvis');return}const rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.onstart=()=>status('Listening','listening');rec.onresult=e=>{$('prompt').value=e.results[0][0].transcript;$('form').requestSubmit()};rec.onerror=()=>status('System ready');rec.onend=()=>{if(!$('prompt').value)status('System ready')};rec.start()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
