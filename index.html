<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18"><meta name="description" content="J.A.R.V.I.S. — Personal voice-first AI assistant">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./jarvis-icon.svg" type="image/svg+xml"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><link rel="apple-touch-icon" href="./jarvis-icon.svg">
<title>J.A.R.V.I.S.</title>
<style>
:root{color-scheme:dark;--bg:#050b18;--panel:#0a1426;--line:#183b59;--cyan:#62d9ff;--blue:#218bff;--muted:#8ba6bd;--white:#eaf7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 24%,#0c2944 0,#071426 38%,#030711 78%);color:var(--white);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.shell{max-width:900px;margin:auto;min-height:100dvh;padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow-x:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17334b;padding:8px 2px 16px}.brand{letter-spacing:.2em;font-size:clamp(21px,4.5vw,28px);font-weight:850;color:#e5f8ff;text-shadow:0 0 16px #42caff88}.brand small{display:block;letter-spacing:.18em;color:#6e9bb9;font-size:9px;margin-top:3px}.status{font-size:11px;color:#8acfe9;letter-spacing:.12em}
main{flex:1;display:flex;flex-direction:column;align-items:center}
 .core-wrap{height:clamp(150px,28vh,260px);min-height:150px;width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.core{width:190px;height:190px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 24px #168bff66)}
.core:before,.core:after{content:"";position:absolute;border:1px solid #49caff88;border-radius:50%;inset:0;box-shadow:0 0 24px #168bff33,inset 0 0 22px #168bff22}
.core:before{transform:scaleX(.48) rotate(35deg);animation:spin 9s linear infinite}.core:after{transform:scaleX(.72) rotate(-35deg);animation:spin 12s linear infinite reverse}
.ring{position:absolute;inset:15px;border:2px solid transparent;border-top-color:#72e4ff;border-bottom-color:#238fff;border-radius:50%;animation:spin 5s linear infinite}
.ring.two{inset:29px;border-width:1px;border-left-color:#51bfff;border-right-color:#51bfff;animation-duration:3.5s;animation-direction:reverse}
.reactor{width:116px;height:116px;position:relative;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#0b3b67 0,#061a34 43%,#020a18 70%);box-shadow:0 0 20px #39cfff88,0 0 58px #087bff66,inset 0 0 24px #53dfff55;animation:reactorBreath 3.2s ease-in-out infinite}.reactor:before{content:"";position:absolute;inset:8px;border-radius:50%;border:4px solid transparent;border-top-color:#c9faff;border-bottom-color:#36bfff;box-shadow:0 0 16px #42d9ff;animation:spin 4s linear infinite}.reactor:after{content:"";position:absolute;inset:20px;border-radius:50%;border:2px dashed #7be7ff;opacity:.85;animation:spin 13s linear infinite reverse}.reactor-core{width:43px;height:43px;position:relative;z-index:2;clip-path:polygon(50% 0,91% 24%,91% 76%,50% 100%,9% 76%,9% 24%);background:radial-gradient(circle at 35% 28%,#fff 0,#aaf4ff 13%,#39c9ff 35%,#0872c8 65%,#03132c 100%);box-shadow:0 0 20px #a9f5ff;filter:drop-shadow(0 0 12px #5be4ff);animation:corePulse 1.8s ease-in-out infinite}.reactor-cross{position:absolute;inset:-8px;border-radius:50%;border:1px solid #58d8ff88;transform:rotate(45deg) scaleX(.72);box-shadow:0 0 14px #178fff55}.core.listening .reactor{box-shadow:0 0 35px #7affdc,0 0 85px #16dba988}.core.thinking .reactor:before{animation-duration:1s}.core.speaking .reactor-core{animation-duration:.5s}@keyframes reactorBreath{50%{filter:brightness(1.25);transform:scale(1.045)}}@keyframes corePulse{50%{transform:scale(1.12);filter:brightness(1.4)}}
.core.thinking .ring{animation-duration:1s}
@keyframes spin{to{rotate:360deg}}@keyframes pulse{50%{transform:scale(1.09);filter:brightness(1.25)}}
.greeting{text-align:center;margin-top:-7px}.greeting h1{font-size:clamp(22px,5vw,32px);font-weight:400;letter-spacing:.14em;margin:0}.greeting p{color:var(--muted);font-size:13px;margin:7px 0}
.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0}.control,select{background:#0b1a2d;color:#c8eaff;border:1px solid #24506e;border-radius:20px;padding:9px 14px;font:inherit;font-size:12px}.control:active,.control.active{border-color:var(--cyan);background:#102c45}
.chat{width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px;margin:8px 0 14px}.messages{display:flex;flex-direction:column;gap:10px;max-height:32vh;overflow:auto;padding:2px}.msg{max-width:88%;padding:11px 14px;border:1px solid #1c3b56;border-radius:14px;background:#091629;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#102b45;border-color:#23628a}.msg.jarvis{align-self:flex-start}.composer{display:flex;gap:7px;align-items:center;background:#081426;border:1px solid #1b4564;border-radius:17px;padding:7px}.composer input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;padding:8px;font:inherit}.send{border:0;border-radius:12px;background:linear-gradient(135deg,#087dcb,#1c55aa);color:white;padding:0 17px;font-weight:600}.mic,.attach-btn{width:42px;min-width:42px;height:42px;border-radius:12px;border:1px solid #286083;background:#102c45;color:#a8e9ff;font-size:18px}.attach-btn{font-size:20px}.copy-btn{display:block;margin:9px 0 0 auto;border:1px solid #24506e;border-radius:8px;background:#0b1a2d;color:#a8dfff;padding:5px 10px;font-size:11px}.attachment-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 0 8px;border:1px solid #24506e;border-radius:12px;background:#0b1a2d;color:#bdeaff;font-size:12px}.attachment-chip button{margin-left:auto;border:0;background:transparent;color:#ff9a9a;font-size:18px}.msg img{display:block;max-width:180px;max-height:150px;object-fit:cover;border-radius:8px;margin-top:7px}
footer{text-align:center;color:#577c99;font-size:10px;letter-spacing:.12em;padding-top:10px}
@media(max-width:520px){.shell{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.core-wrap{height:clamp(138px,22vh,205px);min-height:138px}.core{width:min(154px,46vw);height:min(154px,46vw)}.reactor{width:96px;height:96px}.reactor-core{width:36px;height:36px}.greeting h1{font-size:clamp(19px,5vw,26px)}.greeting p{font-size:12px;margin:4px 0}.controls{gap:7px;margin:10px 0}.control{padding:8px 11px;font-size:11px}.messages{max-height:26vh}.chat{margin:4px 0 10px}.composer{gap:5px;padding:5px}.mic,.attach-btn{width:38px;min-width:38px;height:38px}.send{padding:0 12px}}
</style></head>
<body><div class="shell">
<header><div class="brand">J.A.R.V.I.S.<small>PERSONAL INTELLIGENCE SYSTEM</small></div><div class="status" id="status">● SYSTEM READY</div></header>
<main><div class="core-wrap"><div class="core" id="core"><div class="ring"></div><div class="ring two"></div><div class="reactor"><div class="reactor-cross"></div><div class="reactor-core"></div></div></div></div>
<div class="greeting"><h1>AT YOUR SERVICE, SIR.</h1><p id="hint">Your personal assistant is standing by.</p></div>
<div class="controls"><select id="mode" aria-label="Personality mode"><option value="professional">Professional</option><option value="witty" selected>Witty</option><option value="philosophical">Philosophical</option></select><button class="control" id="testVoice">Test Alfred voice</button><button class="control" id="voiceToggle">Voice: On</button><button class="control" id="locationEnable">Enable precise location</button><button class="control" id="clear">Clear conversation</button></div>
<section class="chat"><div class="messages" id="messages" aria-live="polite"><div class="msg jarvis">Good evening, Sir. J.A.R.V.I.S. is online. How may I assist?</div></div><div id="attachmentChip" class="attachment-chip" hidden></div><form class="composer" id="form"><button class="mic" type="button" id="mic" aria-label="Speak">🎙</button><button class="attach-btn" type="button" id="attach" aria-label="Attach a file" title="Attach a file">＋</button><button class="attach-btn" type="button" id="camera" aria-label="Take a photo" title="Take a photo">▣</button><input id="prompt" autocomplete="off" placeholder="Ask me anything, Sir…" maxlength="12000"><button class="send" type="submit">SEND</button></form><input id="fileInput" type="file" accept="image/*,application/pdf,text/plain,text/csv,application/json,text/markdown" hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></section>
</main><footer>J.A.R.V.I.S. · PERSONAL AI · VOICE-FIRST INTERFACE</footer></div>
<script>
const $=id=>document.getElementById(id), core=$('core'), messages=$('messages');let history=[],voiceOn=true,pendingAttachment=null,deviceLocation=null,currentAudio=null;
function status(s,cls=''){ $('status').textContent='● '+s.toUpperCase();core.className='core '+cls}
function add(text,who,attachment){const d=document.createElement('div');d.className='msg '+who;const body=document.createElement('div');body.textContent=text;d.appendChild(body);if(attachment&&attachment.mimeType&&attachment.mimeType.startsWith('image/')){const img=document.createElement('img');img.alt=attachment.name||'Attached image';img.src='data:'+attachment.mimeType+';base64,'+attachment.data;d.appendChild(img)}if(who==='jarvis'){const copy=document.createElement('button');copy.className='copy-btn';copy.type='button';copy.textContent='▢ Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}copy.textContent='✓ Copied';setTimeout(()=>copy.textContent='▢ Copy',1500)};d.appendChild(copy)}messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}

function setAttachment(file){if(!file)return;const allowed=['application/pdf','text/plain','text/csv','application/json','text/markdown'];if(!(file.type.startsWith('image/')||allowed.includes(file.type))){$('hint').textContent='Please choose an image, PDF, TXT, CSV, JSON or Markdown file, Sir.';return;}if(file.size>3*1024*1024){$('hint').textContent='That file is larger than the 3 MB limit, Sir.';return;}const reader=new FileReader();reader.onload=()=>{const data=String(reader.result).split(',')[1]||'';pendingAttachment={name:file.name||'Camera photo',mimeType:file.type||'image/jpeg',data};renderAttachment()};reader.onerror=()=>{$('hint').textContent='I could not read that file, Sir.'};reader.readAsDataURL(file)}
function renderAttachment(){const chip=$('attachmentChip');chip.innerHTML='';if(!pendingAttachment){chip.hidden=true;return}chip.hidden=false;const label=document.createElement('span');label.textContent='📎 '+pendingAttachment.name;chip.appendChild(label);const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove attachment');remove.onclick=()=>{pendingAttachment=null;renderAttachment()};chip.appendChild(remove)}
$('attach').onclick=()=>{if(window.AndroidJarvis&&window.AndroidJarvis.chooseFile){window.AndroidJarvis.chooseFile()}else{$('fileInput').click()}};
$('camera').onclick=()=>{if(window.AndroidJarvis&&window.AndroidJarvis.takePhoto){window.AndroidJarvis.takePhoto()}else{$('cameraInput').click()}};
$('fileInput').onchange=e=>{if(e.target.files[0])setAttachment(e.target.files[0]);e.target.value=''};
$('cameraInput').onchange=e=>{if(e.target.files[0])setAttachment(e.target.files[0]);e.target.value=''};
function getDeviceContext(){const now=new Date();return {localTime:now.toLocaleString('en-IN',{dateStyle:'full',timeStyle:'long'}),isoTime:now.toISOString(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown',location:deviceLocation};}
function requestPreciseLocation(){if(!navigator.geolocation){$('hint').textContent='Location services are not available in this browser, Sir.';return;}$('hint').textContent='Requesting precise location permission…';navigator.geolocation.getCurrentPosition(pos=>{deviceLocation={latitude:Number(pos.coords.latitude.toFixed(6)),longitude:Number(pos.coords.longitude.toFixed(6)),accuracyMeters:Math.round(pos.coords.accuracy),capturedAt:new Date().toISOString()};$('locationEnable').textContent='Location: Enabled';$('hint').textContent='Precise location received (±'+deviceLocation.accuracyMeters+' m). It will accompany your AI requests, Sir.';},err=>{$('hint').textContent=err.code===1?'Location permission was denied. Enable Precise location for J.A.R.V.I.S. in Android App permissions, Sir.':err.code===2?'The phone could not determine its location. Check that Location is switched on, Sir.':'Location request timed out. Please try again, Sir.';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});}
$('locationEnable').onclick=requestPreciseLocation;
function offlineReply(message,mode){const q=message.toLowerCase(),p=mode==='philosophical'?'A thought, Sir: ':mode==='witty'?'Certainly, Sir. ':'';if(/\\b(where am i|my location|current location|where are we)\\b/.test(q))return deviceLocation?'Your current coordinates are latitude '+deviceLocation.latitude+', longitude '+deviceLocation.longitude+', with an estimated accuracy of '+deviceLocation.accuracyMeters+' metres, Sir.':'I do not have your location yet, Sir. Tap Enable precise location and grant permission.';if(/\\b(hello|hi|hey|good morning|good afternoon|good evening|good night)\\b/.test(q))return 'Good day, Sir. All systems are standing by. What can I do for you?';if(/\\b(time|what time)\\b/.test(q))return 'The time on this device is '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+', Sir.';if(/\\b(date|today'?s date|what day)\\b/.test(q))return 'Today is '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+', Sir.';if(/\\b(who are you|your name|introduce yourself)\\b/.test(q))return 'I am J.A.R.V.I.S., your personal assistant interface, Sir.';if(/\\b(search|google|look up)\\b/.test(q)){const t=message.replace(/^(please\s+)?(search( for)?|google|look up)\s*/i,'').trim();return t?'Here is your search: https://www.google.com/search?q='+encodeURIComponent(t):'What shall I search for, Sir?'}if(/\\b(open|visit|go to)\\b/.test(q)){const sites=[['youtube','https://youtube.com'],['google','https://google.com'],['gmail','https://mail.google.com'],['wikipedia','https://wikipedia.org'],['github','https://github.com']];const h=sites.find(([n])=>q.includes(n));return h?'Opening '+h[0]+': '+h[1]:'Name a site such as Google, YouTube, Gmail, Wikipedia, or GitHub, Sir.'}if(/\\b(thanks|thank you)\\b/.test(q))return 'Always a pleasure, Sir.';return p+'the no-key mode can handle greetings, time, date, basic identity, common websites, and web searches. Open-ended questions need an AI model, Sir.'}
// Cache generated Algieba audio on this device. Repeating the same text
// reuses the exact same recording instead of spending another Gemini request.
const speechMemoryCache=new Map();
let speechDbPromise=null;
function openSpeechCache(){
  if(!('indexedDB' in window))return Promise.resolve(null);
  if(speechDbPromise)return speechDbPromise;
  speechDbPromise=new Promise(resolve=>{
    const request=indexedDB.open('jarvis-speech-cache-v1',1);
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio',{keyPath:'key'});};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>resolve(null);
    request.onblocked=()=>resolve(null);
  });
  return speechDbPromise;
}
function speechCacheKey(text){return 'gemini-3.1-flash-tts-preview|Algieba|en-GB|'+text;}
async function getCachedSpeech(key){
  if(speechMemoryCache.has(key))return speechMemoryCache.get(key);
  const db=await openSpeechCache();if(!db)return null;
  return new Promise(resolve=>{
    const tx=db.transaction('audio','readonly'),request=tx.objectStore('audio').get(key);
    request.onsuccess=()=>{const blob=request.result?.blob||null;if(blob)speechMemoryCache.set(key,blob);resolve(blob);};
    request.onerror=()=>resolve(null);
  });
}
async function saveCachedSpeech(key,blob){
  speechMemoryCache.set(key,blob);
  const db=await openSpeechCache();if(!db)return;
  await new Promise(resolve=>{
    const tx=db.transaction('audio','readwrite');
    tx.objectStore('audio').put({key,blob,savedAt:Date.now()});
    tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve;
  });
  // Keep the local cache bounded: retain the 40 most recently saved clips.
  await new Promise(resolve=>{
    const tx=db.transaction('audio','readwrite'),store=tx.objectStore('audio'),items=[];
    const cursor=store.openCursor();
    cursor.onsuccess=()=>{const c=cursor.result;if(c){items.push({key:c.key,savedAt:c.value.savedAt||0});c.continue();}else{
      items.sort((a,b)=>b.savedAt-a.savedAt);
      items.slice(40).forEach(item=>store.delete(item.key));resolve();
    }};
    cursor.onerror=resolve;
  });
}
async function speak(text){
  if(!voiceOn)return;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const spoken=String(text).trim().slice(0,4000);
  if(!spoken)return;
  const cacheKey=speechCacheKey(spoken);
  status('Preparing voice','thinking');
  try{
    let blob=await getCachedSpeech(cacheKey);
    if(blob){$('hint').textContent='Using the saved Alfred voice recording, Sir.';}
    else{
      status('Generating voice','thinking');
      const response=await fetch('https://jarvis-sigma-one-92.vercel.app/api/speech',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:spoken})
      });
      if(!response.ok){
        const raw=await response.text();let data={};try{data=JSON.parse(raw)}catch{}
        throw new Error(data.error||('Speech service returned HTTP '+response.status));
      }
      blob=new Blob([await response.arrayBuffer()],{type:'audio/wav'});
      await saveCachedSpeech(cacheKey,blob);
    }
    const audioUrl=URL.createObjectURL(blob);
    const audio=new Audio(audioUrl);currentAudio=audio;
    audio.onended=()=>{URL.revokeObjectURL(audioUrl);if(currentAudio===audio)currentAudio=null;status('System ready');};
    audio.onerror=()=>{URL.revokeObjectURL(audioUrl);if(currentAudio===audio)currentAudio=null;status('Speech playback failed');$('hint').textContent='I generated the voice, but this device could not play the audio, Sir.';};
    await audio.play();
    status('Speaking','speaking');
  }catch(error){
    currentAudio=null;status('Voice service unavailable');
    $('hint').textContent='I could not generate speech, Sir. '+error.message;
  }
}
$('testVoice').onclick=()=>{speak('Good evening, Sir. I am JARVIS. How may I assist you today?');$('hint').textContent='Testing the British voice…';};
$('voiceToggle').onclick=()=>{voiceOn=!voiceOn;$('voiceToggle').textContent='Voice: '+(voiceOn?'On':'Off');if(!voiceOn){if(currentAudio){currentAudio.pause();currentAudio=null;}}};
$('clear').onclick=()=>{history=[];messages.innerHTML='';add('Conversation cleared, Sir. What shall we discuss?','jarvis')};
$('form').onsubmit=async e=>{e.preventDefault();const message=$('prompt').value.trim();if(!message&&!pendingAttachment)return;$('prompt').value='';const attachment=pendingAttachment;pendingAttachment=null;renderAttachment();add(message||'Please examine this attachment, Sir.', 'user',attachment);history.push({role:'user',text:message||'Please examine the attached file.'});
const appCommand=message.match(/^\s*(?:jarvis[, ]+)?(?:please\s+)?(?:open|launch|start)\s+([a-z0-9 +.-]+?)(?:\s+app)?[.!?]*\s*$/i);
const appAliases={'whatsapp':'whatsapp','you tube':'youtube','youtube':'youtube','chrome':'chrome','gmail':'gmail','google maps':'maps','maps':'maps','spotify':'spotify','instagram':'instagram','facebook':'facebook','telegram':'telegram','camera':'camera','play store':'play store','messages':'messages','message':'messages','phone':'phone','settings':'settings','phone settings':'settings','twitter':'twitter','x':'x','reddit':'reddit','photos':'photos','google photos':'photos','calendar':'calendar','google calendar':'calendar','keep':'keep','google keep':'keep','contacts':'contacts','drive':'drive','google drive':'drive','files':'files','file manager':'files','amazon':'amazon','flipkart':'flipkart','browser':'browser','calculator':'calculator','gallery':'gallery','swiggy':'swiggy','zomato':'zomato'};
if(appCommand && window.AndroidJarvis){const appName=appAliases[appCommand[1].toLowerCase().trim()];if(appName){const reply=window.AndroidJarvis.openApp(appName);add(reply,'jarvis');history.push({role:'model',text:reply});$('hint').textContent='Ready when you are.';status('System ready');speak(reply);return;}}
status('Thinking','thinking');$('hint').textContent='Processing your request…';try{const r=await fetch('https://jarvis-sigma-one-92.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message||'Please examine the attached file and describe its contents.',history,mode:$('mode').value,attachment,deviceContext:getDeviceContext()})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch{}if(!r.ok)throw Error(data.error||('AI service returned HTTP '+r.status));const reply=data.reply||'I have no response, Sir.';add(reply,'jarvis');history.push({role:'model',text:reply});history=history.slice(-20);$('hint').textContent='Ready when you are.';speak(reply);if(!voiceOn)status('System ready');}catch(err){const msg='I could not reach my intelligence service, Sir. '+err.message;add(msg,'jarvis');$('hint').textContent='The AI service needs to be configured.';status('Service unavailable');speak(msg)}};
window.jarvisNative={onSpeechResult:(transcript)=>{$('prompt').value=transcript;$('form').requestSubmit();},onAttachment:(raw)=>{try{const a=typeof raw==='string'?JSON.parse(raw):raw;pendingAttachment=a;renderAttachment();$('hint').textContent='Attachment ready, Sir. Add a question or send it as it is.'}catch(e){$('hint').textContent='I could not load that attachment, Sir.'}}};
$('mic').onclick=()=>{if(window.AndroidJarvis){window.AndroidJarvis.startVoiceRecognition();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('Voice recognition is not supported by this browser, Sir.','jarvis');return}const rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.onstart=()=>status('Listening','listening');rec.onresult=e=>{$('prompt').value=e.results[0][0].transcript;$('form').requestSubmit()};rec.onerror=()=>status('System ready');rec.onend=()=>{if(!$('prompt').value)status('System ready')};rec.start()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
